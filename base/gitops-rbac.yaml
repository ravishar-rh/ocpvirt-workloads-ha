# OpenShift GitOps RBAC for instance CRs and Secrets.
# Apply once as cluster-admin before syncing instances (RoleBindings require bind):
#   oc apply -f base/gitops-rbac.yaml
#
# Also included in the operators Application (base/) so Argo CD keeps it in sync.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-gitops-ocpvirt-workloads-ha-instances
  labels:
    app.kubernetes.io/part-of: ocpvirt-workloads-ha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups:
      - remediation.medik8s.io
    resources:
      - nodehealthchecks
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - fence-agents-remediation.medik8s.io
    resources:
      - fenceagentsremediationtemplates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - operator.openshift.io
    resources:
      - kubedeschedulers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-ocpvirt-workloads-ha-instances
  labels:
    app.kubernetes.io/part-of: ocpvirt-workloads-ha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-ocpvirt-workloads-ha-instances
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
# ClusterRole + namespace admin for GitOps application-controller (instance CRDs).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-admin
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/part-of: ocpvirt-workloads-ha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-admin
  namespace: openshift-kube-descheduler-operator
  labels:
    app.kubernetes.io/part-of: ocpvirt-workloads-ha
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
