# Shared namespace and OperatorGroup for workload-availability operators.
# OperatorGroup uses AllNamespaces mode (no targetNamespaces) because FAR, MDR,
# SNR, and NHC only support AllNamespaces install mode per their CSV.
# Descheduler uses a separate namespace (base/namespace-openshift-kube-descheduler-operator.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-workload-availability
  labels:
    openshift.io/cluster-monitoring: "true"
    app.kubernetes.io/part-of: ocpvirt-workloads-ha
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-workload-availability
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/part-of: ocpvirt-workloads-ha
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# AllNamespaces install mode — required by Medik8s workload-availability operators.
