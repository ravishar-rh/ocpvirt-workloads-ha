# Self Node Remediation Operator (default remediation backend)
# InstallPlan approval order: 2 of 6
# Approve after node-maintenance operator is installed and CSV is Succeeded.
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: self-node-remediation
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/name: self-node-remediation
    app.kubernetes.io/component: operator
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    ocpvirt-workloads-ha/install-plan-order: "2"
spec:
  channel: stable
  installPlanApproval: Manual
  name: self-node-remediation
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    tolerations: []
---
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationTemplate
metadata:
  name: self-node-remediation-resource-deletion-template
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/name: self-node-remediation
    app.kubernetes.io/component: instance
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    spec: {}
