# Fence Agents Remediation Operator with HPE iLO configuration
# InstallPlan approval order: 2 of 4
# Instance CRs (Secret, FenceAgentsRemediationTemplate) are in ../instances/
# and sync via the ocpvirt-workloads-ha-instances Application after this operator
# CSV reaches Succeeded.
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: fence-agents-remediation
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/name: fence-agents-remediation
    app.kubernetes.io/component: operator
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    ocpvirt-workloads-ha/install-plan-order: "2"
spec:
  channel: stable
  installPlanApproval: Manual
  name: fence-agents-remediation
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    tolerations: []
