# Cluster Kube Descheduler Operator
# InstallPlan approval order: 6 of 6
# Namespace and OperatorGroup live in base/namespace-openshift-kube-descheduler-operator.yaml.
# Approve after node-health-check operator is installed.
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-kube-descheduler-operator
  namespace: openshift-kube-descheduler-operator
  labels:
    app.kubernetes.io/name: cluster-kube-descheduler-operator
    app.kubernetes.io/component: operator
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    ocpvirt-workloads-ha/install-plan-order: "6"
spec:
  channel: stable
  installPlanApproval: Manual
  name: cluster-kube-descheduler-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    tolerations: []
---
apiVersion: operator.openshift.io/v1
kind: KubeDescheduler
metadata:
  name: cluster
  namespace: openshift-kube-descheduler-operator
  labels:
    app.kubernetes.io/name: cluster-kube-descheduler-operator
    app.kubernetes.io/component: instance
  annotations:
    argocd.argoproj.io/sync-wave: "55"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  managementState: Managed
  profiles:
    - LifecycleAndUtilization
  profileCustomizations:
    devLowNodeUtilizationThresholds:
      thresholds:
        cpu: 30
        memory: 30
        pods: 30
      targetThresholds:
        cpu: 75
        memory: 75
        pods: 75
