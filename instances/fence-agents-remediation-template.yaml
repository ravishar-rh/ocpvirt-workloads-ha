apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediationTemplate
metadata:
  name: far-template-hpe-ilo4
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/name: fence-agents-remediation
    app.kubernetes.io/component: instance
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  # Optional: limit BMC status validation to a sample of nodes (absolute or percent).
  statusValidationSample: "100%"
  template:
    spec:
      agent: fence_ilo4
      remediationStrategy: ResourceDeletion
      retrycount: 5
      retryinterval: 5s
      timeout: 120s
      # Credentials inline — OpenShift GitOps cannot create Secrets in openshift-* namespaces.
      # Replace placeholders before production; or switch to sharedSecretName + oc create secret.
      sharedparameters:
        --lanplus: "1"
        --action: reboot
        --username: ilo-admin
        --password: changeme
        pcmk_host_check: static-list
      # Parameter name -> { nodeName: value }. Keys must match `oc get nodes` exactly.
      nodeparameters:
        ipaddr:
          worker-0.example.com: "192.0.2.10"
          worker-1.example.com: "192.0.2.11"
          worker-2.example.com: "192.0.2.12"
        plug:
          worker-0.example.com: "1"
          worker-1.example.com: "1"
          worker-2.example.com: "1"
