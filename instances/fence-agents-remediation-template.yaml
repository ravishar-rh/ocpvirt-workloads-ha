apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediationTemplate
metadata:
  name: far-template-hpe-ilo4
  namespace: openshift-workload-availability
  labels:
    app.kubernetes.io/name: fence-agents-remediation
    app.kubernetes.io/component: instance
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  template:
    spec:
      agent: fence_ilo4
      remediationStrategy: ResourceDeletion
      retrycount: 5
      retryinterval: 5s
      timeout: 120s
      sharedSecretName: fence-agents-credentials-hpe-ilo
      sharedparameters:
        lanplus: "1"
        pcmk_host_check: static-list
        method: reboot
      nodeparameters:
        worker-0.example.com:
          ipaddr: 192.0.2.10
          plug: "1"
        worker-1.example.com:
          ipaddr: 192.0.2.11
          plug: "1"
        worker-2.example.com:
          ipaddr: 192.0.2.12
          plug: "1"
