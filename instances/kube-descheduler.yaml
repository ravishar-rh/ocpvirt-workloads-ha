apiVersion: operator.openshift.io/v1
kind: KubeDescheduler
metadata:
  name: cluster
  namespace: openshift-kube-descheduler-operator
  labels:
    app.kubernetes.io/name: cluster-kube-descheduler-operator
    app.kubernetes.io/component: instance
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  managementState: Managed
  profiles:
    - LifecycleAndUtilization
  profileCustomizations:
    # Preset thresholds for LowNodeUtilization (string, not an object):
    #   Low    — 10% underutilized / 30% overutilized
    #   Medium — 20% underutilized / 50% overutilized (default)
    #   High   — 40% underutilized / 70% overutilized
    devLowNodeUtilizationThresholds: Medium
