# Bootstrap RBAC for OpenShift GitOps (apply once as cluster-admin):
#   oc apply -k bootstrap/
#
# Same manifests as base/gitops-rbac.yaml; kept here so bootstrap stays a
# one-shot step before Applications are registered.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base/gitops-rbac.yaml
